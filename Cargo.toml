[package]
name = "conc"
version = "0.1.0"
edition = "2021"
description = "Conc - port en Rust de la app Flet de FFmpeg"
license = "MIT"

[dependencies]
eframe = "0.29"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
directories = "5"
chrono = "0.4"

[profile.release]
opt-level = 2
